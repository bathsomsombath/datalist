name: Sync apps to Supabase
on:
  push:
    branches: [main]
    paths: ['**.html']
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SB_URL: https://tbwkbtslmtxvwnqcqljx.supabase.co
      SB_KEY: sb_publishable_G30ExD8MuYHXOF9I-Qs4-w_Dao4H7zD
    steps:
      - uses: actions/checkout@v4
      - name: Upload HTML apps (Storage ql_files/apps + table ql_agent_files)
        run: |
          set -e
          H=(-H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          for f in *.html; do
            [ "$f" = "index.html" ] && continue
            echo "== $f"
            curl -sf -X POST "$SB_URL/storage/v1/object/ql_files/apps/$f" "${H[@]}" \
              -H "Content-Type: text/plain; charset=utf-8" -H "x-upsert: true" --data-binary @"$f" >/dev/null
            jq -n --rawfile c "$f" --arg n "$f" '{name:$n, content:$c, updated_at:(now|todate)}' > body.json
            name=$(jq -rn --arg n "$f" '$n|@uri')
            got=$(curl -sf -X PATCH "$SB_URL/rest/v1/ql_agent_files?name=eq.$name&deleted_at=is.null&select=id" "${H[@]}" \
              -H "Content-Type: application/json" -H "Prefer: return=representation" --data-binary @body.json)
            if [ "$got" = "[]" ]; then
              curl -sf -X POST "$SB_URL/rest/v1/ql_agent_files" "${H[@]}" -H "Content-Type: application/json" --data-binary @body.json
              echo "inserted"
            else
              echo "updated $got"
            fi
          done
