<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Lane Card Maker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --blue:#003876;
    --blue2:#0057a8;
    --orange:#f47b20;
  }
  *{box-sizing:border-box;}
  body{
    font-family:Arial, Helvetica, sans-serif;
    background:#e9edf1;
    margin:0;
    padding:20px;
    display:flex;
    flex-wrap:wrap;
    gap:24px;
  }
  .panel{
    background:#fff;
    border-radius:10px;
    padding:18px 20px;
    box-shadow:0 1px 4px rgba(0,0,0,.15);
    width:320px;
    flex-shrink:0;
  }
  .panel h2{
    font-size:16px;
    margin:0 0 12px;
    color:var(--blue);
  }
  label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin:10px 0 4px;
    color:#333;
  }
  input[type=text], input[type=number], select{
    width:100%;
    padding:7px 8px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:14px;
  }
  input[type=file]{
    width:100%;
    font-size:12px;
  }
  .radio-row{
    display:flex;
    gap:14px;
    margin-top:4px;
  }
  .radio-row label{
    display:flex;
    align-items:center;
    gap:5px;
    font-weight:normal;
    margin:0;
  }
  .scale-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .scale-row input[type=range]{
    flex:1;
  }
  .scale-row span{
    width:46px;
    text-align:right;
    font-size:12px;
    color:#555;
  }
  button{
    margin-top:16px;
    width:100%;
    padding:10px;
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
  }
  button:hover{ background:var(--blue2); }
  button.secondary{
    background:#6c757d;
    margin-top:8px;
  }
  button.secondary:hover{ background:#5a6268; }

  /* ---- Card ---- */
  .stage{
    flex:1;
    min-width:340px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
  }
  .card{
    --w:15cm;
    --name-scale:1;
    --num-scale:1;
    --icon-scale:1;
    --photo-shift:0%;
    --photo-scale:1;
    --name-shift:0%;
    --num-shift:0%;
    width:var(--w);
    font-size:calc(var(--w) / 100);
    aspect-ratio:15/4.5;
    background:#fff;
    border:6px solid var(--blue);
    border-radius:22px;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
    font-family:Arial, Helvetica, sans-serif;
  }
  .card .head{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:3.5% 4% 2%;
    border-bottom:3px solid var(--blue);
  }
  .card .brand{
    font-size:calc(8.2em * var(--logo-scale));
    font-weight:900;
    font-style:italic;
    color:var(--blue);
    letter-spacing:-0.5px;
    line-height:1;
  }
  .card .subbrand{
    font-size:calc(3.4em * var(--logo-scale));
    font-weight:800;
    color:var(--blue);
    letter-spacing:2px;
    margin-top:2%;
  }
  .card .body{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:3% 4%;
    gap:4%;
  }
  .card .photo-box{
    width:calc(26% * var(--photo-scale));
    aspect-ratio:1/1;
    border:3px solid var(--blue);
    border-radius:12px;
    overflow:hidden;
    background:#f2f2f2;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transform:translateY(var(--photo-shift));
  }
  .card .photo-box img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .card .photo-box .placeholder{
    color:#aaa;
    font-size:12px;
    text-align:center;
    padding:6px;
  }
  .card .name-col{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:0;
    align-self:center;
    border-right:2px solid var(--blue);
    padding-right:4%;
  }
  .card .name{
    font-size:calc(9.5em * var(--name-scale));
    font-weight:900;
    color:#0d1b3d;
    line-height:1.05;
    word-break:break-word;
    text-align:center;
    transform:translateY(var(--name-shift));
  }
  .card .num-col{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6%;
    transform:translateY(var(--num-shift));
  }
  .card .icon{
    height:calc(16em * var(--icon-scale));
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--blue);
  }
  .card .icon svg{ height:100%; width:auto; display:block; }
  .card .num-label{
    font-size:calc(5.5em * var(--num-scale));
    font-weight:800;
    color:var(--blue);
    white-space:nowrap;
  }
  .card .num-value{
    font-size:calc(13em * var(--num-scale));
    font-weight:900;
    color:var(--blue);
    line-height:1;
  }
  .card .foot{
    background:var(--blue);
    color:#fff;
    text-align:center;
    font-size:3.6em;
    font-weight:bold;
    letter-spacing:1.5px;
    padding:2.2% 0;
  }

  .sync{font-size:11px;padding:2px 8px;border-radius:10px;background:#eee;color:#555;float:right;margin-top:2px;}
  .sync.ok{background:#d4edda;color:#155724;}
  .sync.err{background:#f8d7da;color:#721c24;}
  .sync.busy{background:#fff3cd;color:#856404;}
  .row2{display:flex;gap:8px;}
  .row2 button{margin-top:8px;}
  button.green{background:#198754;}
  button.green:hover{background:#157347;}
  button.red{background:#b02a37;}
  .saved{max-height:180px;overflow:auto;border:1px solid #ddd;border-radius:6px;margin-top:6px;}
  .saved div{padding:6px 8px;font-size:13px;border-bottom:1px solid #eee;cursor:pointer;display:flex;justify-content:space-between;}
  .saved div:hover,.saved div.on{background:#e7f0fa;}
  .saved small{color:#777;}
  hr{border:none;border-top:1px solid #e3e3e3;margin:14px 0 4px;}
  @media (max-width:700px){ body{padding:10px;} .panel{width:100%;} .stage{min-width:0;width:100%;overflow:auto;} }
  @media print{
    body{ background:#fff; padding:0; }
    .panel{ display:none; }
    .stage{ min-width:0; }
    .card{ border-color:var(--blue) !important; }
  }
</style>
</head>
<body>

  <div class="panel">
    <h2>Quick Lane Card Maker <span class="sync" id="sync">connecting…</span></h2>

    <label>Saved cards (Supabase)</label>
    <div class="saved" id="savedList"><div><small>loading…</small></div></div>

    <label>Pick staff (ql_staff)</label>
    <select id="staffPick"><option value="">— type name manually —</option></select>
    <hr>

    <label>Staff name</label>
    <input type="text" id="staffName" placeholder="e.g. Bik Seepha" value="Bik Seepha">

    <label>Photo</label>
    <input type="file" id="photoInput" accept="image/*">

    <label>Card type</label>
    <div class="radio-row">
      <label><input type="radio" name="cardType" value="LIFT" checked> Lift No.</label>
      <label><input type="radio" name="cardType" value="TOOL"> Tool No.</label>
    </div>

    <label>Number</label>
    <input type="text" id="numValue" value="4" maxlength="3">

    <label>Print size (scale)</label>
    <div class="scale-row">
      <input type="range" id="scaleSlider" min="50" max="150" value="100">
      <span id="scaleVal">100%</span>
    </div>

    <label>Name size</label>
    <div class="scale-row">
      <input type="range" id="nameSlider" min="50" max="200" value="100">
      <span id="nameVal">100%</span>
    </div>

    <label>Lift / Tool number size</label>
    <div class="scale-row">
      <input type="range" id="numSlider" min="50" max="200" value="100">
      <span id="numSizeVal">100%</span>
    </div>

    <label>Symbol size</label>
    <div class="scale-row">
      <input type="range" id="iconSlider" min="50" max="200" value="100">
      <span id="iconVal">100%</span>
    </div>

    <label>Picture size</label>
    <div class="scale-row">
      <input type="range" id="photoSizeSlider" min="50" max="200" value="100">
      <span id="photoSizeVal">100%</span>
    </div>

    <label>Picture position (up/down)</label>
    <div class="scale-row">
      <input type="range" id="photoPosSlider" min="-50" max="50" value="0">
      <span id="photoPosVal">0%</span>
    </div>

    <label>Name position (up/down)</label>
    <div class="scale-row">
      <input type="range" id="namePosSlider" min="-50" max="50" value="0">
      <span id="namePosVal">0%</span>
    </div>

    <label>Number position (up/down)</label>
    <div class="scale-row">
      <input type="range" id="numPosSlider" min="-50" max="50" value="0">
      <span id="numPosVal">0%</span>
    </div>

    <div class="row2">
      <button class="green" onclick="saveCard()">💾 Save</button>
      <button class="secondary" onclick="newCard()">＋ New</button>
      <button class="red" id="delBtn" onclick="deleteCard()" style="display:none">🗑</button>
    </div>
    <button onclick="window.print()">Print card</button>
    <button class="secondary" onclick="downloadPNG()">Download as image</button>
  </div>

  <div class="stage">
    <div class="card" id="card">
      <div class="body">
        <div class="photo-box" id="photoBox">
          <div class="placeholder">No photo<br>uploaded</div>
        </div>
        <div class="name-col">
          <div class="name" id="nameOut">Bik Seepha</div>
        </div>
        <div class="num-col">
          <div class="icon" id="iconOut"></div>
          <div class="num-label" id="labelOut">LIFT NO.</div>
          <div class="num-value" id="numOut">4</div>
        </div>
      </div>
    </div>
  </div>

<script>
/* Two-post lift, front-view car — matches reference */
const carIcon = `<svg viewBox="6 18 133 101" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
  <!-- posts -->
  <rect x="18" y="23" width="11.5" height="91"/>
  <rect x="115.5" y="23" width="11.5" height="91"/>
  <!-- floor bases -->
  <rect x="11" y="105" width="25.5" height="9" rx="2"/>
  <rect x="108.5" y="105" width="25.5" height="9" rx="2"/>
  <!-- lift arms -->
  <rect x="18" y="83" width="28" height="8.5" rx="2"/>
  <rect x="99" y="83" width="28" height="8.5" rx="2"/>
  <!-- wheels -->
  <rect x="36" y="70" width="11" height="12" rx="2.5"/>
  <rect x="98" y="70" width="11" height="12" rx="2.5"/>
  <!-- mirrors -->
  <rect x="33" y="41" width="9" height="6" rx="2.5"/>
  <rect x="103" y="41" width="9" height="6" rx="2.5"/>
  <!-- body (front view) -->
  <path d="M35 74 L35 52 Q35 47 40 45.5 L54 34 Q56.5 32 60 32 L85 32 Q88.5 32 91 34
           L105 45.5 Q110 47 110 52 L110 74 Z"/>
  <!-- windscreen -->
  <path d="M60 36 L85 36 Q87 36 88.5 37.2 L98 45 L47 45 L56.5 37.2 Q58 36 60 36 Z"
        fill="#d2e1ef"/>
  <!-- headlights -->
  <rect x="41" y="52" width="12" height="7" rx="3.5" fill="#fff"/>
  <rect x="92" y="52" width="12" height="7" rx="3.5" fill="#fff"/>
</svg>`;

/* Crossed screwdriver + open-end wrench — matches reference */
const toolIcon = `<svg viewBox="12 13 76 74" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
  <!-- wrench: jaw upper-right, handle lower-left -->
  <g transform="translate(50,50) rotate(45)">
    <path d="M-11 -20 L-11 -40 Q-11 -45 -6.5 -45 L-4.5 -45 L-4.5 -32 L4.5 -32 L4.5 -45
             L6.5 -45 Q11 -45 11 -40 L11 -20 Z"/>
    <rect x="-5.5" y="-24" width="11" height="64" rx="5.5"/>
    <circle cx="0" cy="33" r="3.2" fill="#fff"/>
  </g>
  <!-- screwdriver: blade upper-left, handle lower-right, white outline where it crosses -->
  <g transform="translate(50,50) rotate(-45)" stroke="#fff" stroke-width="1.6" stroke-linejoin="round">
    <path d="M-4.6 -48 L4.6 -48 L3.2 -39 L-3.2 -39 Z"/>
    <rect x="-3" y="-40" width="6" height="25"/>
    <rect x="-6.5" y="-17.5" width="13" height="5.5" rx="1.5"/>
    <rect x="-8.5" y="-13" width="17" height="52" rx="7.5"/>
  </g>
</svg>`;

const nameOut = document.getElementById('nameOut');
const numOut = document.getElementById('numOut');
const labelOut = document.getElementById('labelOut');
const iconOut = document.getElementById('iconOut');
const photoBox = document.getElementById('photoBox');
const card = document.getElementById('card');

function updateName(){ nameOut.textContent = document.getElementById('staffName').value || ' '; }
function updateNum(){ numOut.textContent = document.getElementById('numValue').value || ''; }
function updateType(){
  const type = document.querySelector('input[name=cardType]:checked').value;
  if(type === 'LIFT'){
    labelOut.textContent = 'LIFT NO.';
    iconOut.innerHTML = carIcon;
  } else {
    labelOut.textContent = 'TOOL NO.';
    iconOut.innerHTML = toolIcon;
  }
}
function updateScale(){
  const val = document.getElementById('scaleSlider').value;
  document.getElementById('scaleVal').textContent = val + '%';
  card.style.setProperty('--w', (15*val/100) + 'cm');
}
function updateNameSize(){
  const val = document.getElementById('nameSlider').value;
  document.getElementById('nameVal').textContent = val + '%';
  card.style.setProperty('--name-scale', val/100);
}
function updateIconSize(){
  const val = document.getElementById('iconSlider').value;
  document.getElementById('iconVal').textContent = val + '%';
  card.style.setProperty('--icon-scale', val/100);
}
function updateNumSize(){
  const val = document.getElementById('numSlider').value;
  document.getElementById('numSizeVal').textContent = val + '%';
  card.style.setProperty('--num-scale', val/100);
}
function updatePhotoPos(){
  const val = document.getElementById('photoPosSlider').value;
  document.getElementById('photoPosVal').textContent = val + '%';
  card.style.setProperty('--photo-shift', val + '%');
}
function updatePhotoSize(){
  const val = document.getElementById('photoSizeSlider').value;
  document.getElementById('photoSizeVal').textContent = val + '%';
  card.style.setProperty('--photo-scale', val/100);
}
function updateNamePos(){
  const val = document.getElementById('namePosSlider').value;
  document.getElementById('namePosVal').textContent = val + '%';
  card.style.setProperty('--name-shift', val + '%');
}
function updateNumPos(){
  const val = document.getElementById('numPosSlider').value;
  document.getElementById('numPosVal').textContent = val + '%';
  card.style.setProperty('--num-shift', val + '%');
}

document.getElementById('staffName').addEventListener('input', updateName);
document.getElementById('numValue').addEventListener('input', updateNum);
document.querySelectorAll('input[name=cardType]').forEach(r=>r.addEventListener('change', updateType));
document.getElementById('scaleSlider').addEventListener('input', updateScale);
document.getElementById('nameSlider').addEventListener('input', updateNameSize);
document.getElementById('numSlider').addEventListener('input', updateNumSize);
document.getElementById('iconSlider').addEventListener('input', updateIconSize);
document.getElementById('photoPosSlider').addEventListener('input', updatePhotoPos);
document.getElementById('photoSizeSlider').addEventListener('input', updatePhotoSize);
document.getElementById('namePosSlider').addEventListener('input', updateNamePos);
document.getElementById('numPosSlider').addEventListener('input', updateNumPos);

/* ===== Supabase (live) ===== */
const SB_URL = 'https://tbwkbtslmtxvwnqcqljx.supabase.co';
const SB_KEY = 'sb_publishable_G30ExD8MuYHXOF9I-Qs4-w_Dao4H7zD';
const BUCKET = 'ql_files';
const H = {apikey:SB_KEY, Authorization:'Bearer '+SB_KEY};
let currentId = null, photoUrl = '', staff = [], cards = [];

function setSync(t, cls){ const s=document.getElementById('sync'); s.textContent=t; s.className='sync '+(cls||''); }
async function db(path, opt={}){
  const r = await fetch(SB_URL+'/rest/v1/'+path, {...opt, headers:{...H,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});
  if(!r.ok) throw new Error(r.status+' '+await r.text());
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SLIDERS = ['scaleSlider','nameSlider','numSlider','iconSlider','photoSizeSlider','photoPosSlider','namePosSlider','numPosSlider'];
function refreshAll(){ updateName(); updateNum(); updateType(); updateScale(); updateNameSize(); updateNumSize(); updateIconSize(); updatePhotoSize(); updatePhotoPos(); updateNamePos(); updateNumPos(); }

function showPhoto(url){
  photoUrl = url || '';
  photoBox.innerHTML = url ? '<img crossorigin="anonymous" src="'+esc(url)+'">' : '<div class="placeholder">No photo<br>uploaded</div>';
}

async function loadStaff(){
  staff = await db('ql_staff?select=id,name,full_name,photo_url&active=eq.true&order=sort_order.asc.nullslast,name.asc');
  const sel = document.getElementById('staffPick');
  sel.innerHTML = '<option value="">— type name manually —</option>' + staff.map(s=>'<option value="'+s.id+'">'+esc(s.name||s.full_name)+(s.photo_url?' 📷':'')+'</option>').join('');
}
async function loadCards(){
  cards = await db('ql_cards?select=*&deleted_at=is.null&order=card_type.asc,num.asc');
  const box = document.getElementById('savedList');
  box.innerHTML = cards.length ? cards.map(c=>'<div data-id="'+c.id+'" class="'+(c.id===currentId?'on':'')+'"><span>'+esc(c.name)+'</span><small>'+c.card_type+' '+esc(c.num||'')+'</small></div>').join('') : '<div><small>No saved cards yet</small></div>';
  box.querySelectorAll('[data-id]').forEach(d=>d.onclick=()=>openCard(+d.dataset.id));
}
function openCard(id){
  const c = cards.find(x=>x.id===id); if(!c) return;
  currentId = c.id;
  document.getElementById('staffPick').value = c.staff_id || '';
  document.getElementById('staffName').value = c.name;
  document.getElementById('numValue').value = c.num || '';
  document.querySelector('input[name=cardType][value='+c.card_type+']').checked = true;
  SLIDERS.forEach(k=>{ if(c.settings && c.settings[k]!=null) document.getElementById(k).value = c.settings[k]; });
  showPhoto(c.photo_url); refreshAll(); loadCards();
  document.getElementById('delBtn').style.display='';
}
function newCard(){
  currentId = null;
  document.getElementById('staffPick').value=''; document.getElementById('staffName').value=''; document.getElementById('numValue').value='';
  SLIDERS.forEach(k=>{ const el=document.getElementById(k); el.value = el.defaultValue; });
  showPhoto(''); refreshAll(); loadCards();
  document.getElementById('delBtn').style.display='none';
}
async function saveCard(){
  const name = document.getElementById('staffName').value.trim();
  if(!name){ setSync('name required','err'); return; }
  const row = {
    staff_id: +document.getElementById('staffPick').value || null,
    name, card_type: document.querySelector('input[name=cardType]:checked').value,
    num: document.getElementById('numValue').value.trim(),
    photo_url: photoUrl || null,
    settings: Object.fromEntries(SLIDERS.map(k=>[k,+document.getElementById(k).value])),
    updated_at: new Date().toISOString()
  };
  setSync('saving…','busy');
  try{
    const r = currentId ? await db('ql_cards?id=eq.'+currentId,{method:'PATCH',body:JSON.stringify(row)})
                        : await db('ql_cards',{method:'POST',body:JSON.stringify(row)});
    currentId = r[0].id; await loadCards(); setSync('saved ✓','ok');
    document.getElementById('delBtn').style.display='';
  }catch(e){ setSync('save error','err'); console.error(e); }
}
let delArmed = false;
async function deleteCard(){
  const b = document.getElementById('delBtn');
  if(!currentId) return;
  if(!delArmed){ delArmed = true; b.textContent='Sure?'; setTimeout(()=>{delArmed=false;b.textContent='🗑';},3000); return; }
  delArmed=false; b.textContent='🗑';
  try{ await db('ql_cards?id=eq.'+currentId,{method:'PATCH',body:JSON.stringify({deleted_at:new Date().toISOString()})}); setSync('deleted','ok'); newCard(); }
  catch(e){ setSync('delete error','err'); console.error(e); }
}

document.getElementById('staffPick').addEventListener('change', function(){
  const s = staff.find(x=>x.id==this.value); if(!s) return;
  document.getElementById('staffName').value = s.name || s.full_name; updateName();
  if(s.photo_url) showPhoto(s.photo_url);
});

document.getElementById('photoInput').addEventListener('change', async function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => { photoBox.innerHTML = '<img src="' + ev.target.result + '">'; };
  reader.readAsDataURL(file);
  setSync('uploading photo…','busy');
  try{
    const ext = (file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    const path = 'cards/'+Date.now()+'_'+(document.getElementById('staffName').value||'staff').replace(/[^\w-]+/g,'_')+'.'+ext;
    const r = await fetch(SB_URL+'/storage/v1/object/'+BUCKET+'/'+path,{method:'POST',headers:{...H,'Content-Type':file.type||'image/jpeg','x-upsert':'true'},body:file});
    if(!r.ok) throw new Error(r.status+' '+await r.text());
    photoUrl = SB_URL+'/storage/v1/object/public/'+BUCKET+'/'+path;
    setSync('photo uploaded – press Save','ok');
  }catch(err){ setSync('photo upload error','err'); console.error(err); }
});

async function downloadPNG(){
  const fname = (document.getElementById('staffName').value || 'card') + '.png';
  try{
    if(!window.html2canvas) throw new Error('html2canvas not loaded');
    const canvas = await html2canvas(card,{scale:3,useCORS:true,backgroundColor:null});
    const a = document.createElement('a');
    a.download = fname; a.href = canvas.toDataURL('image/png'); a.click();
  }catch(e){
    console.error(e);
    setSync('use Print → Save as PDF','err');
  }
}

refreshAll();
(async()=>{
  try{ await Promise.all([loadStaff(), loadCards()]); setSync('live ✓','ok'); }
  catch(e){ setSync('offline – check connection','err'); console.error(e); }
})();
</script>

</body>
</html>
