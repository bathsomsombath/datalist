<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>QL Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{
  --rail:#0B3B7C;--rail-hi:rgba(255,255,255,.15);--rail-hover:rgba(255,255,255,.08);--rail-ink:#EDF3FC;--rail-ink-2:#A8C0E4;
  --bg:#E9EDF3;--surface:#FFFFFF;--surface-2:#F4F6F9;--hover:#EAEFF6;--sel:#DCE7FB;--sel-line:#8FB0EE;
  --ink:#13243D;--ink-2:#4A5B74;--ink-3:#7D8AA0;--line:#DFE4EC;--line-2:#C8D1DD;
  --accent:#1A5AD4;--accent-ink:#FFFFFF;--accent-soft:#E1EAFB;
  --manila:#E4AE48;--manila-2:#C68F2C;--star:#E5A01A;--danger:#C53A31;--ok:#1F8A57;
  --toast:#13243D;--toast-ink:#F2F6FC;--toast-act:#9EC0FF;
  --shadow:0 1px 2px rgba(15,32,60,.10),0 10px 28px rgba(15,32,60,.16);
  --font:'Barlow','Noto Sans Thai','Noto Sans Lao','Leelawadee UI','Tahoma','Leelawadee UI','Lao Sangam MN','Phetsarath OT',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --rail:#0A2047;--rail-hi:rgba(255,255,255,.12);--rail-hover:rgba(255,255,255,.07);--rail-ink:#E4ECF9;--rail-ink-2:#8EA7CF;
  --bg:#0A101C;--surface:#101A2B;--surface-2:#152238;--hover:#1A2A44;--sel:#1B3460;--sel-line:#4670BE;
  --ink:#E6EDF7;--ink-2:#A9B7CB;--ink-3:#7A89A0;--line:#21304A;--line-2:#2E4060;
  --accent:#77A3FF;--accent-ink:#0A1222;--accent-soft:#1A2D54;
  --manila:#D9A443;--manila-2:#B4842A;--star:#F1B53C;--danger:#F2756B;--ok:#4CC28E;
  --toast:#E6EDF7;--toast-ink:#0F1A2B;--toast-act:#1A5AD4;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --rail:#0A2047;--rail-hi:rgba(255,255,255,.12);--rail-hover:rgba(255,255,255,.07);--rail-ink:#E4ECF9;--rail-ink-2:#8EA7CF;
  --bg:#0A101C;--surface:#101A2B;--surface-2:#152238;--hover:#1A2A44;--sel:#1B3460;--sel-line:#4670BE;
  --ink:#E6EDF7;--ink-2:#A9B7CB;--ink-3:#7A89A0;--line:#21304A;--line-2:#2E4060;
  --accent:#77A3FF;--accent-ink:#0A1222;--accent-soft:#1A2D54;
  --manila:#D9A443;--manila-2:#B4842A;--star:#F1B53C;--danger:#F2756B;--ok:#4CC28E;
  --toast:#E6EDF7;--toast-ink:#0F1A2B;--toast-act:#1A5AD4;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.5);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:400 14px/1.45 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ti{width:22px;height:22px;flex:none;display:block}
svg.ti.big{width:56px;height:56px}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);height:100vh;height:100dvh}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding:14px 12px 12px;overflow-y:auto;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 16px;font-weight:700;font-size:20px}
.brand svg{width:30px;height:30px}
.new-btn{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;margin:0 0 14px 2px;padding:12px 22px 12px 16px;border-radius:16px;background:#fff;color:#0B3B7C;font-weight:600;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.new-btn:hover{background:#EEF4FE}
.new-btn svg{width:22px;height:22px;stroke-width:2.2}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:40px;padding:8px 12px;border-radius:10px;color:var(--rail-ink);text-align:left}
.nav button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:hover{background:var(--rail-hover)}
.nav button[aria-current="true"]{background:var(--rail-hi);font-weight:600}
.nav button.drop-on{background:rgba(255,255,255,.22)!important;outline:2px dashed #fff;outline-offset:-2px}
.nav .tag{margin-left:auto;font-size:11px;line-height:18px;padding:0 7px;border-radius:999px;border:1px solid rgba(255,255,255,.25);color:var(--rail-ink-2);flex:none}
.nav-h{font-size:12.5px;color:var(--rail-ink-2);padding:16px 12px 6px}
.nav-hx{display:flex;align-items:center;justify-content:space-between;padding-right:4px}
.nav-hx button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--rail-ink-2)}
.nav-hx button:hover{background:var(--rail-hover);color:var(--rail-ink)}
.nav-hx svg{width:16px;height:16px}
.app-row{position:relative;display:flex;align-items:center}
.app-row>button[data-app]{flex:1;min-width:0}
.app-row .app-more{position:absolute;right:4px;width:30px;height:30px;min-height:0;padding:0;justify-content:center;border-radius:8px;opacity:0}
.app-row:hover .app-more,.app-row .app-more:focus-visible,body.touch .app-row .app-more{opacity:1}
.app-row .app-more svg{width:16px;height:16px}
.nav .app-empty{font-size:12.5px;color:var(--rail-ink-2);padding:4px 12px 8px}
/* staff photos + org chart */
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;font-size:12.5px;font-weight:700;color:#fff;background:var(--av,#64748B)}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:96px;height:96px;font-size:30px}
.sname{display:flex;align-items:center;gap:10px;min-width:0}
.sname span{overflow:hidden;text-overflow:ellipsis}
.stable td.r-title{max-width:360px}
.seg.sm button{padding:5px 12px;font-size:13px}
.phbox{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.phbox .acts{display:flex;flex-wrap:wrap;gap:8px}
.org-stats{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px 4px}
.org-stat{display:flex;align-items:baseline;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px;color:var(--ink-2)}
.org-stat b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.org-stat.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.org-wrap{overflow:auto;padding:8px 0 40px}
.org{display:inline-block;min-width:100%;padding:10px 24px 24px;box-sizing:border-box}
.org-root-drop{margin:6px 16px 0;padding:10px;border:2px dashed var(--line-2);border-radius:12px;color:var(--ink-3);text-align:center;font-size:13px;display:none}
.org-dragging .org-root-drop{display:block}
.org-root-drop.drop-on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.oc{position:relative;display:flex;align-items:center;gap:10px;width:208px;padding:10px 30px 10px 10px;background:var(--surface);border:1px solid var(--line-2);border-top:4px solid var(--av,#64748B);border-radius:12px;box-shadow:0 1px 2px rgba(15,23,42,.08);text-align:left;cursor:pointer;user-select:none}
.oc:hover{border-color:var(--accent)}
.oc.drop-on{outline:3px solid var(--accent);outline-offset:2px}
.oc.drag-src{opacity:.45}
.oc .av{width:42px;height:42px;font-size:14px}
.oc-t{min-width:0;display:flex;flex-direction:column;gap:2px}
.oc-t b{font-size:13.5px;line-height:1.25;color:var(--ink);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.oc-t span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-more{position:absolute;top:4px;right:2px;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3)}
.oc-more:hover{background:var(--hover);color:var(--ink)}
.oc-more svg{width:16px;height:16px}
.oc-tog{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2);font-size:11px;font-weight:600;color:var(--ink-2);z-index:1}
.oc-tog:hover{border-color:var(--accent);color:var(--accent)}
.org.no-photo .oc .av{display:none}
.org.no-photo .oc{padding-left:14px}
/* tree (top-down) */
.org.tree ul{display:flex;justify-content:center;margin:0;padding:22px 0 0;position:relative}
.org.tree li{list-style:none;display:flex;flex-direction:column;align-items:center;position:relative;padding:22px 7px 0}
.org.tree li::before,.org.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:22px;border-top:2px solid var(--line-2)}
.org.tree li::after{right:auto;left:50%;border-left:2px solid var(--line-2)}
.org.tree li:only-child::before{display:none}
.org.tree li:only-child::after{border-top:0}
.org.tree li:first-child::before,.org.tree li:last-child::after{border-top:0}
.org.tree li:last-child::before{border-right:2px solid var(--line-2);border-radius:0 8px 0 0}
.org.tree li:first-child:not(:only-child)::after{border-radius:8px 0 0 0}
.org.tree ul ul::before{content:"";position:absolute;top:0;left:50%;height:22px;border-left:2px solid var(--line-2)}
.org.tree>ul{padding-top:0}
.org.tree>ul>li{padding-top:0}
.org.tree>ul>li::before,.org.tree>ul>li::after{display:none}
/* stacked team: children in one column under the manager */
.org.tree li.stack>ul{flex-direction:column;align-items:flex-start;padding:22px 0 0 26px}
.org.tree li.stack>ul::before{left:50%;height:22px}
.org.tree li.stack>ul>li{padding:6px 0 6px 22px;align-items:flex-start}
.org.tree li.stack>ul>li::before{display:block;top:0;bottom:0;left:0;right:auto;width:0;height:auto;border:0;border-left:2px solid var(--line-2);border-radius:0}
.org.tree li.stack>ul>li:last-child::before{bottom:auto;height:calc(50% + 0px)}
.org.tree li.stack>ul>li::after{display:block;top:50%;left:0;width:22px;height:0;border:0;border-top:2px solid var(--line-2);border-radius:0}
.org.tree li.stack>ul>li:first-child::before{top:0}
/* indented list layout */
.org.list ul{margin:0;padding:0 0 0 28px;position:relative}
.org.list>ul{padding-left:0}
.org.list li{list-style:none;position:relative;padding:6px 0 6px 22px}
.org.list>ul>li{padding-left:0}
.org.list ul ul>li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--line-2)}
.org.list ul ul>li:last-child::before{bottom:auto;height:calc(6px + 32px)}
.org.list ul ul>li::after{content:"";position:absolute;left:0;top:calc(6px + 32px);width:22px;border-top:2px solid var(--line-2)}
.org.list .oc{width:min(320px,80vw)}
.org.list .oc-tog{left:auto;right:-10px;bottom:auto;top:50%;transform:translateY(-50%)}
@media print{
  body *{visibility:hidden}
  .org-print,.org-print *{visibility:visible}
  .org-print{position:absolute;left:0;top:0;overflow:visible!important}
  .oc-more,.oc-tog,.org-root-drop{display:none!important}
}

.fnote{color:var(--ink-3);font-size:13px;margin:0 0 6px}
.ros-wrap{overflow:auto;padding:0 0 30px}
.ros{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.ros th,.ros td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;white-space:nowrap}
.ros thead th{position:sticky;top:0;z-index:3;background:var(--surface);font-weight:600;color:var(--ink-2);padding:6px 4px;font-size:12px;vertical-align:bottom}
.ros thead tr.mrow th{top:0;font-size:12px;color:var(--ink);background:var(--hover)}
.ros thead tr.drow th{top:28px}
.ros .rn{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:6px 12px;min-width:220px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.ros thead .rn{z-index:4}
.ros .rn small{display:block;color:var(--ink-3);font-weight:400;font-size:11.5px}
.ros .rt{position:sticky;right:0;background:var(--surface);font-weight:700;min-width:46px;padding:6px}
.ros td.rc{width:40px;min-width:40px;height:40px;cursor:pointer}
.ros td.rc:hover{background:var(--hover)}
.ros td.rc.on{background:var(--accent-soft)}
.ros td.rc.on::after{content:"✓";color:var(--accent);font-weight:800;font-size:15px}
.ros td.rc.past{opacity:.55}
.ros th.today,.ros td.today{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
.ros tfoot td{position:sticky;bottom:0;background:var(--hover);font-weight:700;padding:6px 4px;font-size:12px}
.ros tfoot td.low{color:var(--danger)}
.ros th.hol{min-width:92px;max-width:110px;white-space:normal;line-height:1.25;cursor:pointer}
.ros th.hol:hover{color:var(--accent)}
.ros th.hol small{display:block;font-weight:400;color:var(--ink-3)}
.ros td.hc{min-width:92px}
.ros-legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 16px;color:var(--ink-3);font-size:12.5px}
@media print{.ros-print,.ros-print *{visibility:visible}.ros-print{position:absolute;left:0;top:0;overflow:visible!important}}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.app-host{position:relative;flex:1;min-height:0;background:#fff;border-top:1px solid var(--line)}
.app-host[hidden]{display:none}
.app-host iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.app-host iframe[hidden]{display:none}
.app-msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-3);background:var(--surface)}
.app-note{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--surface);color:var(--ink-2);border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px}
.app-ico{display:inline-grid;place-items:center;color:var(--ink-3);margin-right:8px}
.app-seg{display:flex;gap:4px;padding:3px;border-radius:10px;background:var(--hover);margin-bottom:12px}
.app-seg button{flex:1;padding:7px 10px;border-radius:8px;font-weight:600;color:var(--ink-2)}
.app-seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.usage{margin-top:auto;padding:16px 12px 4px;font-size:12.5px;color:var(--rail-ink-2)}
.usage b{color:var(--rail-ink);font-weight:600}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden;margin-bottom:8px}
.meter i{display:block;height:100%;background:var(--manila);border-radius:3px}
.scrim{display:none}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:8px;height:66px;padding:10px 14px 10px 18px;flex:none}
.search{flex:1;min-width:0;max-width:760px;display:flex;align-items:center;gap:10px;height:46px;padding:0 6px 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--ink-2)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);color:var(--ink)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-size:15px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{display:none}
.top-actions{display:flex;gap:2px;margin-left:auto}
.icon-btn{width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.only-m{display:none!important}

/* pane */
.pane{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;margin:0 14px 14px 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pane.busy::before{content:"";position:absolute;left:0;top:0;height:2px;width:40%;background:var(--accent);animation:slide 1s ease-in-out infinite;z-index:3}
@keyframes slide{0%{left:-40%}100%{left:100%}}
.pane.dragging{outline:2px solid var(--accent);outline-offset:-2px}
.bar{display:flex;align-items:center;gap:8px;min-height:64px;padding:10px 12px 10px 14px;flex:none}
.crumbs{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow:hidden}
.crumb{flex:none;display:inline-flex;align-items:center;gap:2px;max-width:260px;min-width:0;padding:6px 10px;border-radius:10px;font-size:18px;color:var(--ink-2);white-space:nowrap}
.crumb .ct{min-width:0;overflow:hidden;text-overflow:ellipsis}
.crumb svg{width:18px;height:18px;color:var(--ink-3)}
.state .big-i{width:46px;height:46px;color:var(--ink-3);stroke-width:1.4}
.v-load{display:grid;place-items:center}
button.crumb:hover{background:var(--hover);color:var(--ink)}
.crumb.cur{flex-shrink:1;color:var(--ink);font-size:21px;font-weight:600}
.crumbs .sep{display:inline-flex;color:var(--ink-3);flex:none}
.crumbs .sep svg{width:18px;height:18px}
.chips{display:flex;gap:6px;margin-left:8px;overflow-x:auto;scrollbar-width:none;flex-shrink:100;min-width:0}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);font-size:13px;white-space:nowrap;flex:none}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.bar-tools{display:flex;align-items:center;gap:2px;margin-left:auto;flex:none}
.tbtn{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:8px 12px;border-radius:10px;color:var(--ink-2);white-space:nowrap;flex:none}
.tbtn:hover{background:var(--hover);color:var(--ink)}
.tbtn.danger:hover{color:var(--danger)}
.selbar{display:flex;align-items:center;gap:2px;flex:1;min-width:0;min-height:46px;padding:3px 6px;border-radius:14px;background:var(--accent-soft);overflow-x:auto;scrollbar-width:none}
.selbar .count{font-weight:600;margin:0 10px 0 2px;white-space:nowrap}
.selbar .tbtn{color:var(--ink)}
.selbar .tbtn:hover{background:rgba(127,140,160,.16)}

/* items */
.list-wrap{position:relative;flex:1;min-height:0;overflow:auto;padding:0 14px 110px;overscroll-behavior:contain}
.sec-h{font-size:14px;font-weight:600;color:var(--ink-2);padding:10px 4px}
.fgrid,.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.grid{gap:14px}
.fgrid+.sec-h{padding-top:22px}
.fcard,.card{position:relative;background:var(--surface-2);border:1px solid transparent;border-radius:12px;user-select:none;-webkit-user-select:none;cursor:default}
.fcard{display:flex;align-items:center;gap:12px;height:52px;padding:0 4px 0 14px}
.card{display:flex;flex-direction:column;padding:2px 4px 4px}
.fcard:hover,.card:hover{background:var(--hover)}
.card .hd{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 0 4px 10px}
.card .pv{position:relative;aspect-ratio:4/3;border-radius:9px;background:var(--surface);display:grid;place-items:center;overflow:hidden}
.card .pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.card .pv img.ok{opacity:1}
.card .loc{font-size:12px;color:var(--ink-3);padding:6px 8px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.more{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);opacity:0}
.more:hover{background:rgba(120,136,160,.18);color:var(--ink)}
.fcard:hover .more,.card:hover .more,.row:hover .more,.is-sel .more,.more:focus-visible,body.touch .more{opacity:1}
.is-sel,.is-sel:hover{background:var(--sel)!important;border-color:var(--sel-line)!important}
.drop-on{background:var(--accent-soft)!important;outline:2px dashed var(--accent);outline-offset:-2px}
.starb{display:inline-flex;color:var(--star);flex:none}
.starb svg{width:15px;height:15px}
.rhead,.row{display:grid;align-items:center;gap:10px;padding:0 6px 0 8px;border-bottom:1px solid var(--line)}
.cols-f{grid-template-columns:24px 24px minmax(0,1fr) 170px 100px 36px}
.cols-l{grid-template-columns:24px 24px minmax(0,1fr) minmax(140px,240px) 150px 90px 36px}
.cols-t{grid-template-columns:24px 24px minmax(0,1fr) minmax(160px,300px) 160px 36px}
.rhead{position:sticky;top:0;z-index:2;background:var(--surface);min-height:44px;font-size:13px;color:var(--ink-2);font-weight:600}
.rhead .hcell{display:inline-flex;align-items:center;gap:4px;padding:6px;margin-left:-6px;border-radius:8px;justify-self:start;white-space:nowrap}
.rhead button.hcell:hover{background:var(--hover);color:var(--ink)}
.rhead .hcell svg{width:15px;height:15px}
.row{min-height:50px;user-select:none;-webkit-user-select:none;cursor:default}
.row:hover{background:var(--hover)}
.row.is-sel{border-radius:10px}
.c-name{display:flex;align-items:center;gap:8px;min-width:0}
.c-name .sub{display:none}
.c-mod,.c-size,.c-loc{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;font-size:13.5px}
.chk{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--line-2);display:grid;place-items:center;color:transparent;background:var(--surface);opacity:0}
.chk svg{width:14px;height:14px;stroke-width:2.6}
.row:hover .chk,.rows.has-sel .chk,body.touch .chk{opacity:1}
.row.is-sel .chk{opacity:1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* states */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;min-height:min(60vh,520px);padding:24px;color:var(--ink-2)}
.state h3{margin:6px 0 0;font-size:19px;font-weight:600;color:var(--ink)}
.state p{margin:0;max-width:440px}
.state .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.state.err .i{width:40px;height:40px;color:var(--danger)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:rot .8s linear infinite;flex:none}
.spin.lg{width:30px;height:30px;border-width:3px;color:var(--accent)}
@keyframes rot{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 18px;border-radius:11px;font-weight:600;color:var(--accent);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--danger);color:#fff}
.btn.outline{border:1px solid var(--line-2);color:var(--ink)}
.btn.outline:hover{background:var(--hover)}
.btn.left{margin-right:auto}
.btn:disabled{opacity:.45}
.drop-hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:14px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);pointer-events:none;max-width:calc(100% - 32px);white-space:nowrap}
.drop-hint b{overflow:hidden;text-overflow:ellipsis}

/* menu, dialogs */
.menu{position:fixed;z-index:120;min-width:230px;max-width:320px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:38px;padding:7px 12px;border-radius:8px;text-align:left;color:var(--ink)}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:none}
.menu button.danger,.menu button.danger svg{color:var(--danger)}
.menu button svg{color:var(--ink-2)}
.menu button:disabled{opacity:.4}
.menu kbd{margin-left:auto;font:inherit;font-size:12px;color:var(--ink-3)}
.menu .sep{height:1px;background:var(--line);margin:6px 4px}
.dlg-bg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(9,17,31,.48)}
.dlg{width:min(460px,94vw);max-height:calc(100dvh - 32px);overflow:auto;padding:22px 24px 18px;background:var(--surface);color:var(--ink);border-radius:18px;box-shadow:var(--shadow)}
.dlg h2{margin:0 0 14px;font-size:20px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.dlg p{margin:0 0 10px;color:var(--ink-2)}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.fld small{color:var(--ink-3);font-size:12.5px}
.inp{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5}
.row2{display:flex;gap:8px}
.err{color:var(--danger);font-size:13px;min-height:18px}
.okmsg{color:var(--ok)}
.chkline{display:flex;align-items:center;gap:10px;color:var(--ink-2);margin-top:6px;cursor:pointer}
.chkline input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.det{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 14px;margin:0}
.det dt{color:var(--ink-3)}
.det dd{margin:0;overflow-wrap:anywhere}
.det code{font-size:12.5px;color:var(--ink-2)}
.share-out{margin-top:14px}
.share-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pk-path{display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin:12px 0 8px}
.pk-path button{padding:4px 8px;border-radius:8px;color:var(--ink-2)}
.pk-path button:hover{background:var(--hover)}
.pk-path .cur{color:var(--ink);font-weight:600}
.pk-path svg{width:16px;height:16px;color:var(--ink-3)}
.pk-list{height:min(320px,46dvh);overflow:auto;border:1px solid var(--line);border-radius:12px;padding:4px}
.pk-list button{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:6px 10px;border-radius:9px;text-align:left}
.pk-list button:hover{background:var(--hover)}
.pk-list button:disabled{opacity:.4}
.pk-list .none{padding:18px;color:var(--ink-3);text-align:center}

/* toasts, transfers */
.toasts{position:fixed;left:20px;bottom:20px;z-index:130;display:flex;flex-direction:column;gap:8px;max-width:min(480px,calc(100vw - 40px))}
.toast{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 8px 8px 16px;border-radius:12px;background:var(--toast);color:var(--toast-ink);box-shadow:var(--shadow);animation:pop .16s ease-out}
.toast.err{background:var(--danger);color:#fff}
.toast .tmsg{flex:1;min-width:0;overflow-wrap:anywhere}
.toast .tact{font-weight:700;color:var(--toast-act);padding:6px 10px;border-radius:8px}
.toast.err .tact{color:#fff}
.toast .tx{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;opacity:.75;flex:none}
.toast .tx:hover{opacity:1;background:rgba(127,127,127,.2)}
.toast.out{opacity:0;transform:translateY(6px);transition:all .16s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.xfers{position:fixed;right:20px;bottom:20px;z-index:110;width:380px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.xf-h{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 16px;background:var(--toast);color:var(--toast-ink);font-weight:600}
.xf-h span{flex:1}
.xf-h button{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:inherit}
.xf-h button:hover{background:rgba(127,127,127,.25)}
.xf-l{max-height:300px;overflow:auto}
.xfers.min .xf-l{display:none}
.xf{display:grid;grid-template-columns:24px minmax(0,1fr) 34px;align-items:center;gap:10px;padding:10px 8px 10px 14px;border-bottom:1px solid var(--line)}
.xf:last-child{border-bottom:0}
.xf .xn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.xf .xs{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.xf.error .xs{color:var(--danger)}
.xf .xb{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.xf .xb i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.xf .xa{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.xf button.xa:hover{background:var(--hover)}
.xf .ok{color:var(--ok)}
.xf .bad{color:var(--danger)}

/* viewer */
.viewer{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;background:#0B111D;color:#EEF3FB}
.v-top{display:flex;align-items:center;gap:10px;height:60px;padding:0 10px;flex:none}
.v-ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#DCE6F5;flex:none}
.v-ib:hover{background:rgba(255,255,255,.12);color:#fff}
.v-title{flex:1;min-width:0}
.v-name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-count{font-size:12.5px;color:#9FB0C8}
.v-acts{display:flex;gap:2px}
.v-body{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.v-img{width:100%;height:100%;display:grid;place-items:center;overflow:auto;padding:8px 72px 24px}
.v-img img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
.v-img.zoom{display:block;padding:8px}
.v-img.zoom img{max-width:none;max-height:none;cursor:zoom-out}
.viewer video{max-width:calc(100% - 144px);max-height:100%;background:#000;border-radius:8px}
.v-aud{display:flex;flex-direction:column;align-items:center;gap:20px}
.v-pdf,.v-doc,.v-text{width:100%;height:100%;overflow:auto}
.v-pdf{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 16px 40px}
.v-pdf .pg{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.4);flex:none;max-width:100%}
.v-pdf canvas{display:block;max-width:100%;height:auto!important}
.v-doc{padding:8px 16px 40px}
.v-doc article{max-width:820px;margin:0 auto;background:#fff;color:#1b2533;padding:48px 56px;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.4);font-size:15px;line-height:1.6}
.v-doc article img{max-width:100%;height:auto}
.v-doc table{border-collapse:collapse}
.v-doc td,.v-doc th{border:1px solid #ccd3dd;padding:4px 8px}
.v-text{padding:8px 16px 40px}
.v-text pre{max-width:1000px;margin:0 auto;padding:22px 24px;background:#fff;color:#1b2533;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.v-sheet{display:flex;flex-direction:column;align-self:stretch;width:calc(100% - 32px);margin:0 16px 16px;background:#fff;color:#1b2533;border-radius:6px;overflow:hidden}
.v-tabs{display:flex;gap:2px;padding:6px 6px 0;border-bottom:1px solid #d9dfe7;overflow-x:auto;flex:none;background:#f3f5f8}
.v-tabs button{padding:7px 14px;border-radius:8px 8px 0 0;color:#4a5568;white-space:nowrap}
.v-tabs button[aria-selected="true"]{background:#fff;color:#1A5AD4;font-weight:600;box-shadow:0 -2px 0 #1A5AD4 inset}
.v-table{overflow:auto;flex:1}
.v-table table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.v-table td,.v-table th{border:1px solid #e1e6ee;padding:4px 8px;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis;text-align:left}
.v-table tr:first-child td,.v-table th{background:#f3f6fa;font-weight:600;position:sticky;top:0}
.v-note{padding:6px 12px;font-size:12.5px;color:#5b6b84;background:#f3f5f8;border-top:1px solid #d9dfe7}
.v-frame{width:calc(100% - 32px);height:100%;border:0;background:#fff;border-radius:6px}
.v-none{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:24px}
.v-none-t{font-size:17px;font-weight:600;margin:6px 0 0}
.v-none-s{color:#9FB0C8;margin:0 0 8px}
.v-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;z-index:2}
.v-nav:hover{background:rgba(255,255,255,.22)}
.v-nav.prev{left:12px}.v-nav.next{right:12px}

/* email viewer */
.v-mail{width:100%;height:100%;overflow:auto;padding:4px 16px 48px;color:#1b2533}
.m-col{max-width:900px;margin:0 auto;box-shadow:0 2px 14px rgba(0,0,0,.45);border-radius:8px}
.m-head{background:#fff;border-radius:8px 8px 0 0;padding:22px 28px 16px}
.m-subj{margin:0 0 16px;font-size:22px;line-height:1.25;font-weight:600;letter-spacing:-.005em;color:#13243D;overflow-wrap:anywhere}
.m-from{display:flex;align-items:flex-start;gap:12px}
.m-av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px}
.m-fw{flex:1;min-width:0}
.m-fl{font-weight:600;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.m-em{font-weight:400;color:#6B7A90;font-size:13.5px}
.m-sep{color:#9AA6B8}
.m-tog{display:inline-flex;align-items:center;gap:2px;margin-top:2px;padding:1px 4px 1px 0;border-radius:6px;color:#4A5B74;font-size:13.5px;max-width:100%;text-align:left}
.m-tog:hover{color:#1A5AD4}
.m-tog svg{width:16px;height:16px;flex:none;transition:transform .15s}
.m-tog[aria-expanded="true"] svg{transform:rotate(180deg)}
.m-date{flex:none;color:#6B7A90;font-size:13px;white-space:nowrap;padding-top:2px}
.m-rcpt{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0 0 52px;padding:10px 12px;background:#F4F6F9;border-radius:8px;font-size:13.5px}
.m-rcpt dt{color:#6B7A90;font-weight:600}
.m-rcpt dd{margin:0;min-width:0;overflow-wrap:anywhere}
.m-rcpt .m-addr{display:inline}
.m-tray{background:#FBF4E4;border-top:1px dashed #DDBB72;border-bottom:1px dashed #DDBB72;padding:12px 28px 14px}
.m-tray-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.m-tray-t{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;color:#7A5410}
.m-tray-t svg{width:17px;height:17px}
.m-tray-a{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.m-lnk{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;color:#1A5AD4;font-weight:600;font-size:13.5px}
.m-lnk:hover{background:rgba(26,90,212,.09)}
.m-lnk svg{width:17px;height:17px}
.m-atts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.m-att{display:flex;align-items:center;background:#fff;border:1px solid #E6D3A8;border-radius:10px;min-width:0;overflow:hidden}
.m-att:hover{border-color:#C9A453}
.m-att-main{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:8px 6px 8px 10px;text-align:left}
.m-att-main .ti{grid-row:1/3;width:30px;height:30px}
.m-att-n{font-size:13.5px;font-weight:600;color:#13243D;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-att-s{font-size:12px;color:#7D8AA0}
.m-att-b{flex:none;width:34px;height:34px;margin-right:2px;border-radius:8px;display:grid;place-items:center;color:#4A5B74}
.m-att-b:hover{background:#EEF2F8;color:#1A5AD4}
.m-att-b svg{width:18px;height:18px}
.m-paper{background:#fff;border-radius:0 0 8px 8px;overflow:hidden}
.m-joined{border-top:1px solid #E6EAF0}
.m-remote{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 28px;background:#EEF3FC;color:#33445E;font-size:13px;border-bottom:1px solid #DCE5F3}
.m-remote .m-lnk{margin-left:auto}
.m-frame{display:block;width:100%;height:240px;border:0;background:#fff}
.m-plain{margin:0;padding:22px 28px 28px;white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 "Segoe UI",Calibri,Arial,"Noto Sans Lao",sans-serif;color:#1b2533}
.v-mail button:focus-visible,.v-att button:focus-visible,.v-att a:focus-visible{outline:2px solid #77A3FF;outline-offset:2px}
.v-att{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;background:#0B111D}
.v-att-bar{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.08);flex:none}
.m-back{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px 0 8px;border-radius:12px;color:#DCE6F5;font-weight:600;flex:none}
.m-back:hover{background:rgba(255,255,255,.12);color:#fff}
.v-att-t{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.v-att-tt{min-width:0}
.v-att-n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-att-s{font-size:12.5px;color:#9FB0C8}
.v-att-body{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.v-att-body .v-img{padding:8px 16px 24px}
.v-att-body video{max-width:calc(100% - 32px)}
@media (max-width:640px){
  .v-mail{padding:0 0 32px}
  .m-col{border-radius:0;box-shadow:none}
  .m-head{border-radius:0;padding:16px 16px 12px}
  .m-subj{font-size:19px}
  .m-from{flex-wrap:wrap}
  .m-date{width:100%;padding:2px 0 0 52px}
  .m-rcpt{margin-left:0}
  .m-tray,.m-remote{padding-left:16px;padding-right:16px}
  .m-paper{border-radius:0}
  .m-atts{grid-template-columns:1fr}
  .m-back span{display:none}
}
@media (prefers-reduced-motion:reduce){.m-tog svg{transition:none}}
.viewer .spin.lg{color:#9EC0FF}
.drag-ghost{position:fixed;top:-100px;left:-100px;padding:8px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab{display:none}
body.focus .app{grid-template-columns:minmax(0,1fr)}
body.focus .rail{display:none}
body.focus .pane{margin-left:14px}

/* ql_kb records */
:root{--p-pend-bg:#FFF1D2;--p-pend:#8F5B00;--p-prog-bg:#E1EAFB;--p-prog:#1A5AD4;--p-done-bg:#DCF2E5;--p-done:#1C7246;--p-ref-bg:#ECEFF4;--p-ref:#4A5B74}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--p-pend-bg:#3A2C0E;--p-pend:#F1C46A;--p-prog-bg:#1A2D54;--p-prog:#8FB2FF;--p-done-bg:#123526;--p-done:#6FD3A0;--p-ref-bg:#1E2A3F;--p-ref:#A9B7CB}}
:root[data-theme="dark"]{--p-pend-bg:#3A2C0E;--p-pend:#F1C46A;--p-prog-bg:#1A2D54;--p-prog:#8FB2FF;--p-done-bg:#123526;--p-done:#6FD3A0;--p-ref-bg:#1E2A3F;--p-ref:#A9B7CB}
.rcount{color:var(--ink-3);font-size:13px;margin:0 6px 0 2px;white-space:nowrap}
.rtable{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}

.nt-t th{background:var(--surface-2);font-weight:600}
.nt-chk{display:inline-grid;place-items:center;width:16px;height:16px;margin-right:6px;border:1.5px solid var(--line-2);border-radius:4px;font-size:11px;vertical-align:-2px}
.nt-chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nt-img{display:block;max-width:100%;margin:6px 0;padding:0;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);min-height:60px;min-width:120px}
.nt-img img{display:block;max-width:100%;max-height:420px;object-fit:contain}
.nt-ext{max-width:100%;border-radius:10px}
.nt-flink{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 6px;margin:2px 0;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--accent);font-weight:500;max-width:100%}
.nt-flink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt-flink svg.i{width:15px;height:15px}
.nt-att{display:block;text-align:left;color:var(--ink);text-decoration:none;font:inherit;padding:0}
.nt-att .ap{position:relative}
.nt-att .ap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.nt-att .ap img.ok{opacity:1}
.nt-miss{border-color:var(--danger)!important;cursor:default}
.nt-miss .as,.nt-miss svg{color:var(--danger)}
.nt-thread{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.nt-cm{padding:10px 12px;border-top:1px solid var(--line)}
.nt-cm:first-child{border-top:0}
.nt-cmh{font-size:12px;color:var(--ink-3);margin-bottom:4px}
.nt-cmt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.5}
.nt-cmt a{color:var(--accent)}
.nt-catts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.nt-cimg{position:relative;width:120px;height:120px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;padding:0}
.nt-cimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.nt-cimg img.ok{opacity:1}
.nt-cimg svg.ti{width:40px;height:40px}
.nt-ca{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:6px 10px 6px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;text-align:left}
.nt-ca span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.nt-ca small{color:var(--ink-3);flex:none}
button.nt-ca:hover,.nt-cimg:hover,.nt-flink:hover,.nt-img:hover{border-color:var(--accent)}
.nt-kid{width:100%;text-align:left;border:0}
.nt-kid:hover{background:var(--hover)}
.nt-kid>span:not(.ntc):not(.nt-emo){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt-kid svg.i{width:16px;height:16px;color:var(--ink-3)}
#ntPanel{z-index:76}
#ntPanel img:not([src]){visibility:hidden}
/* search + arrange: filter bar, highlights, clickable location */
.fbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;padding:0 14px 10px;flex:none;border-bottom:1px solid var(--line)}
.fbar[hidden]{display:none!important}
.fsum{flex:1 1 100%;font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fsum b{color:var(--ink);font-weight:600}
.fsum .scope{padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}
.fgrp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.fgrp .fl{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.fbar .chip .n{margin-left:6px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.fbar .chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.fclear{font-size:13px;color:var(--accent);padding:5px 8px;border-radius:8px}
.fclear:hover{background:var(--hover)}
mark{background:rgba(229,160,26,.32);color:inherit;border-radius:3px;padding:0 1px}
.c-loc[data-loc],.card .loc[data-loc]{cursor:pointer}
.c-loc[data-loc]:hover,.card .loc[data-loc]:hover{color:var(--accent);text-decoration:underline}
.search{position:relative}
.qrec{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);padding:6px;max-height:340px;overflow:auto}
.qrec[hidden]{display:none}
.qrec .qh{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-3);padding:6px 10px 4px;text-transform:uppercase;letter-spacing:.04em}
.qrec .qh button{font-size:12px;color:var(--accent);text-transform:none;letter-spacing:0}
.qrec .qi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:9px;color:var(--ink)}
.qrec .qi:hover,.qrec .qi.on{background:var(--hover)}
.qrec .qi svg{width:16px;height:16px;color:var(--ink-3)}
.qrec .qtip{padding:8px 10px 6px;font-size:13px;color:var(--ink-3)}
.help h3{margin:16px 0 6px;font-size:15px}.help h3:first-child{margin-top:0}
.help ul{margin:0;padding-left:20px;color:var(--ink-2)}.help li{margin:4px 0}
.help kbd{font:600 12px var(--font);padding:1px 7px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;background:var(--surface-2);color:var(--ink)}
@media (max-width:700px){.fbar{padding:0 8px 8px}.fgrp .fl{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

    $('#dlg-root').appendChild(root);
    const prev = document.activeElement;

    root.querySelector('.dlg-foot').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-b]'); if (!btn) return;
      const spec = o.buttons[+btn.dataset.b];

      if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229 && !/^(TEXTAREA|BUTTON|SELECT|A)$/.test(e.target.tagName)) {

const xfer = {

  add(name, dir, size) {

    t.progress = (l, tot) => { if (tot) t.pct = Math.min(100, (l / tot) * 100); xfer.paintOne(t); };

    t.fail = (e) => { const ab = e && e.kind === 'abort'; t.state = ab ? 'cancelled' : 'error'; t.msg = ab ? 'Cancelled' : ((e && e.message) || String(e)); xfer.paint(); xfer.settle(); };

async function moveItemsTo(items, dest, mode, checked) {

  const b = busy(mode === 'move' ? 'Moving…' : 'Copying…');
  let done = 0, renamed = 0;
  const sel = [], kept = new Set(), buckets = new Set([dest.bucket]);
  try {
    for (const it of items) {
      buckets.add(it.bucket);
      if (mode === 'move' && it.bucket === dest.bucket && parentOf(it.key) === dest.prefix) continue;
      let seg = it.seg;
      if (existing.has(seg)) { seg = encName(uniqueName(it.name, existing)); renamed++; }
      existing.add(seg);
      const to = dest.prefix + seg + (it.folder ? '/' : '');
      if (mode === 'move') {
        const par = it.bucket + '|' + parentOf(it.key);
        if (!kept.has(par)) { kept.add(par); await ensureKeep(it.bucket, parentOf(it.key)); }
        if (it.folder) await moveTree(it.bucket, it.key, to, dest.bucket); else await moveKey(it.bucket, it.key, to, dest.bucket);
        starRemap(it.bucket, it.key, to, dest.bucket);

      } else if (it.folder) await copyTree(it.bucket, it.key, to, dest.bucket);
      else await api.copy(it.bucket, it.key, to, dest.bucket);
      sel.push(dest.bucket + '|' + to);
      b.step(++done, items.length);
    }
    b.done((mode === 'move' ? 'Moved ' : 'Copied ') + plural(done, 'item') + ' to ' + destLabel(dest) + (renamed ? ' (' + renamed + ' renamed to avoid duplicates)' : ''),
      { action: 'Open folder', onAction: () => go({ view: 'folder', bucket: dest.bucket, prefix: dest.prefix }) });
  } catch (e) { b.fail(e); }

    const has = isStarred(it);
    if (on && !has) stars.push({ b: it.bucket, k: it.key });

  toast(on ? (items.length === 1 ? 'Added to Starred' : plural(items.length, 'item') + ' added to Starred') : 'Removed from Starred');

}

async function makeLinks(files, exp, dl) {
  const out = [], byB = new Map();
  files.forEach((f) => { if (!byB.has(f.bucket)) byB.set(f.bucket, []); byB.get(f.bucket).push(f); });
  for (const pair of byB) {
    const b = pair[0], list = pair[1];
    if (exp === 'public') {
      list.forEach((f) => out.push({ name: f.name, label: f.label, url: api.publicUrl(b, f.key) + (dl ? '?download=' + encodeURIComponent(f.name) : '') }));
      continue;
    }
    for (let i = 0; i < list.length; i += 100) {
      const chunk = list.slice(i, i + 100);
      const res = await api.signMany(b, chunk.map((f) => f.key), +exp);
      const map = new Map((res || []).map((r) => [r.path, r]));
      chunk.forEach((f) => {
        const r = map.get(f.key), s = r && (r.signedURL || r.signedUrl);
        if (!s || r.error) throw new ApiError('Couldn’t create a link for “' + f.name + '”.', 0, 'other');
        out.push({ name: f.name, label: f.label, url: signedFrom(b, f.key, s) + (dl ? '&download=' + encodeURIComponent(f.name) : '') });
      });
    }
  }
  return out;
}

const asBlob = (file) => (file.type ? file : new Blob([file], { type: guessMime(file.name) }));
let conflictChain = Promise.resolve();
function resolveConflict(name, policy) {
  if (policy.all) return Promise.resolve(policy.all);
  const pick = (ctx, v) => { if (ctx.body.querySelector('#cfAll').checked) policy.all = v; return v; };
  const p = conflictChain.then(async () => {
    if (policy.all) return policy.all;
    const v = await dialog({
      title: 'File already exists',
      body: '<p>“' + esc(name) + '” is already in this folder.</p><p>Replace makes your upload the current file and keeps the old one under Older versions. Keep both saves your upload as a copy.</p><label class="chkline"><input type="checkbox" id="cfAll"> Do this for the rest of this upload</label>',
      buttons: [{ label: 'Skip', onClick: (c) => pick(c, 'skip') }, { label: 'Replace', onClick: (c) => pick(c, 'replace') }, { label: 'Keep both', kind: 'primary', primary: true, onClick: (c) => pick(c, 'keep') }]
    });
    return v || 'skip';
  });

}
async function uploadEntries(entries, target) {
  entries = entries.filter((e) => e.file && !JUNK.has(e.file.name));
  if (!entries.length) return;
  const policy = { all: null }, folderSets = new Map();
  const setFor = (prefix) => {
    if (!folderSets.has(prefix)) folderSets.set(prefix, api.listAll(target.bucket, prefix).then((r) => new Set(r.map((x) => x.name))).catch(() => new Set()));
    return folderSets.get(prefix);
  };
  const jobs = entries.map((e) => {
    const parts = e.rel.normalize('NFC').split('/').map((s) => s.trim()).filter(Boolean);
    const badPart = parts.find((p) => validName(p));
    return { e: e, parts: parts, bad: badPart ? validName(badPart) : '', key: target.prefix + parts.map(encName).join('/'), t: xfer.add(parts[parts.length - 1] || e.file.name, 'up', e.file.size) };
  });
  let ok = 0, failed = 0;
  await pool(jobs, 3, async (j) => {
    if (j.bad) { j.t.fail(new ApiError('Can’t upload: ' + j.bad, 0, 'other')); failed++; return; }
    let key = j.key, upsert = false;
    const pre = await setFor(parentOf(key));
    if (pre.has(segOf(key))) {
      const choice = await resolveConflict(decName(segOf(key)), policy);
      if (choice === 'skip') { j.t.skip(); return; }
      if (choice === 'replace') upsert = true;
      else { const nn = uniqueName(decName(segOf(key)), pre); key = parentOf(key) + encName(nn); j.t.name = nn; }
    }
    pre.add(segOf(key));
    let kept = null;
    for (let attempt = 0; attempt < 4; attempt++) {
      try {
        // Replace keeps the old file as an older version first (never overwritten without a copy)
        if (upsert && !kept) {
          j.t.status('Keeping the old version…');
          try { kept = await archiveVersion(target.bucket, key); }
          catch (ae) { if (ae.kind !== 'missing') throw new ApiError('Couldn’t keep the old version, so the file wasn’t replaced. ' + ae.message, ae.status, ae.kind === 'abort' ? 'abort' : 'perm'); kept = 'none'; }
          j.t.status('');
        }
        await putFile(target.bucket, key, asBlob(j.e.file), { upsert: upsert, onUp: (l, tot) => j.t.progress(l, tot), ctl: j.t.ctl });
        if (upsert) urlCache.delete(target.bucket + '|' + key);
        j.t.done(kept && kept !== 'none' ? 'Replaced · old version kept' : ''); ok++; return;
      } catch (err) {
        if (err.kind === 'dup' && !upsert) {
          const choice = await resolveConflict(decName(segOf(key)), policy);
          if (choice === 'skip') { j.t.skip(); return; }
          if (choice === 'replace') { upsert = true; continue; }
          const pfx = parentOf(key), set = await setFor(pfx);
          set.add(segOf(key));
          const nn = uniqueName(decName(segOf(key)), set); set.add(encName(nn));
          key = pfx + encName(nn); j.t.name = nn; continue;
        }
        if (kept && kept !== 'none') { api.remove(target.bucket, [kept]).catch(() => {}); kept = null; }
        if (err.kind === 'perm' && upsert && !/old version/.test(err.message)) err = new ApiError('Can’t replace files in ' + bucketLabel(target.bucket) + ' (no update permission). Upload again and choose Keep both.', 403, 'perm');
        j.t.fail(err); if (err.kind !== 'abort') failed++; return;
      }
    }
  });
  if (ok) toast('Uploaded ' + plural(ok, 'file') + ' to ' + destLabel(target) + (failed ? ', ' + failed + ' failed' : ''));
  else if (failed) toast(plural(failed, 'upload') + ' failed. See the transfer panel for details.', { error: true });
  await refreshAfter([target.bucket]);
}
function saveBlob(blob, name) {

}
async function downloadOne(it) {

async function downloadZip(items) {
  const name = (items.length === 1 ? items[0].name : 'QL Drive ' + new Date().toISOString().slice(0, 10)) + '.zip';
  const t = xfer.add(name, 'down');

    t.status('Listing files…');

      if (!it.folder) { list.push({ bucket: it.bucket, key: it.key, size: it.size || 0, rel: it.name, date: it.updated }); continue; }
      (await walk(it.bucket, it.key)).files.forEach((f) => { if (f.seg !== KEEP) list.push({ bucket: it.bucket, key: f.key, size: f.size || 0, date: f.updated, rel: it.name + '/' + pathNames(f.key.slice(it.key.length)).join('/') }); });
    }

  } catch (e) { t.fail(e); }
}
function doDownload(items) {

  if (items.length === 1 && !items[0].folder) downloadOne(items[0]); else downloadZip(items);

  if (code === 'PGRST204') return new ApiError('Supabase hasn’t picked up the new field yet. Wait a few seconds and try again.', status, 'cache', raw);

function bindRowPanel() {
  const p = $('#recPanel');
  const timerKey = (f) => RW.t + '|' + RW.key + '|' + f;
  const save = (el) => {
    const t = tableOf(RW.t), c = t && t.colsBy.get(el.dataset.f);
    if (!c) return;
    const r = parseField(c, el);
    if (!r.ok) { toast(c.name + ': ' + r.err, { error: true }); setSave('error', 'Not saved'); return; }
    saveRowField(RW.t, RW.key, c.name, r.v);
  };
  const queue = (el, delay) => {
    const k = timerKey(el.dataset.f), tname = RW.t, key = RW.key;
    if (RW.timers[k]) clearTimeout(RW.timers[k].t);
    const fn = () => { delete RW.timers[k]; if (RW.t === tname && RW.key === key) save(el); };
    RW.timers[k] = { fn: fn, t: setTimeout(fn, delay) };
  };
  p.addEventListener('input', (e) => {
    const el = e.target.closest('[data-f]'); if (!el) return;
    if (el.tagName === 'TEXTAREA') autoGrow(el);
    if (el.dataset.k === 'text' && el.tagName !== 'SELECT') { setSave('saving'); queue(el, 900); }
  });
  p.addEventListener('change', (e) => {
    const el = e.target.closest('[data-f]'); if (!el) return;
    if (el.tagName === 'SELECT' || /^(date|ts)$/.test(el.dataset.k)) save(el);
  });
  p.addEventListener('focusout', (e) => {
    const el = e.target.closest('[data-f]'); if (!el || el.tagName === 'SELECT') return;
    const k = timerKey(el.dataset.f);
    if (RW.timers[k]) { clearTimeout(RW.timers[k].t); RW.timers[k].fn(); }
    else if (/^(num|json|tags|uuid)$/.test(el.dataset.k)) save(el);
  });
  p.addEventListener('click', (e) => {
    const tname = RW.t, key = RW.key, t = tableOf(tname);
    const a = e.target.closest('[data-rp]');
    if (a) {
      const act = a.dataset.rp;
      if (act === 'close') closeRow();
      else if (act === 'copy') { const id = t ? keyLabel(t, key) : key; copyText(id).then((ok) => toast(ok ? 'Copied ' + id : id)); }
      else if (act === 'link') { const u = location.href.split('#')[0] + hashOf({ view: 'table', t: tname, r: key }); copyText(u).then((ok) => toast(ok ? 'Link copied' : u)); }
      else if (act === 'add-files') { $('#recFileIn').dataset.col = a.dataset.col; $('#recFileIn').click(); }
      else if (act === 'add-link') addLink(tname, key, a.dataset.col);
      else if (act === 'delete') deleteRow(tname, key);
      else if (act === 'restore') restoreRow(tname, key);
      else if (act === 'toggle-hidden') { RW.showHidden = !RW.showHidden; renderRowPanel(); }
      else if (act === 'add-field') addFieldDialog(tname);
      return;
    }
    const fm = e.target.closest('[data-fmenu]');
    if (fm) { fieldLabelMenu(fm.dataset.fmenu, fm); return; }
    if (!RW.row) return;
    const more = e.target.closest('[data-attmore]');
    if (more) { const f = filesOf(RW.row[more.dataset.col])[+more.dataset.attmore]; if (f) attMenu(tname, key, more.dataset.col, f, more); return; }
    const att = e.target.closest('[data-att]');
    if (att) { const f = filesOf(RW.row[att.dataset.col])[+att.dataset.att]; if (f && !f.legacy) openAttachment(tname, key, att.dataset.col, f); return; }
    const rm = e.target.closest('[data-lnkrm]');
    if (rm) removeLink(tname, key, rm.dataset.col, +rm.dataset.lnkrm);
  });
  p.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-att]')) { e.preventDefault(); e.target.click(); }
    if (e.key === 'Enter' && e.target.matches && e.target.matches('input[data-f]')) { e.preventDefault(); e.target.blur(); }
  });
  const isFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).indexOf('Files') >= 0;
  let depth = 0;
  p.addEventListener('dragenter', (e) => { if (!isFiles(e) || !RW.row) return; e.preventDefault(); depth++; p.classList.add('dragging'); });
  p.addEventListener('dragover', (e) => { if (!isFiles(e) || !RW.row) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  p.addEventListener('dragleave', (e) => { if (!isFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) p.classList.remove('dragging'); });
  p.addEventListener('drop', (e) => {
    if (!isFiles(e) || !RW.row) return;
    e.preventDefault(); e.stopPropagation(); depth = 0; p.classList.remove('dragging');
    entriesFromDT(e.dataTransfer).then((ents) => dropIntoRow(ents.map((x) => ({ file: x.file, name: x.file.name }))));
  });
  $('#recFileIn').onchange = (e) => {
    const fs = Array.from(e.target.files || []), col = e.target.dataset.col; e.target.value = '';
    if (fs.length && RW.row && col) uploadToRow(RW.t, RW.key, col, fs.map((f) => ({ file: f, name: f.name })));
  };
}

async function doAttach(items) {
  if (!items.length) return;
  const files = [];
  try {
    for (const it of items) {
      if (!it.folder) files.push(it);
      else (await walk(it.bucket, it.key)).files.forEach((f) => { if (f.seg !== KEEP) files.push(f); });
    }
  } catch (e) { toast(e.message, { error: true }); return; }
  if (!files.length) { toast('Nothing to attach. The folder is empty.'); return; }
  if (files.length > 100) { toast('That’s ' + files.length + ' files. Attach up to 100 at a time.', { error: true }); return; }
  try { await Promise.all([loadRecords(), loadSchema().catch(() => null), loadViews()]); } catch (e) { toast(e.message, { error: true }); return; }
  const target = await pickRecord(files);
  if (!target) return;
  const kbt = SCH.by.get(KB_TABLE) || KB_MIN;
  const b = busy('Attaching…');
  let id = target.id;
  try {
    if (target.create) { const row = await db.insertRow(kbt, target.create); putRec(row); id = row.id; }
    const entries = []; let n = 0;
    for (const f of files) {
      if (f.bucket === KB_BUCKET && f.key.indexOf(KB_DIR) === 0) entries.push(fileEntry(f.key, f.name, f.size));
      else { const path = tablePath(KB_TABLE, f.name); await api.copy(f.bucket, f.key, path, KB_BUCKET); entries.push(fileEntry(path, f.name, f.size, f.bucket + '/' + f.key)); }
      b.step(++n, files.length);
    }
    await appendRowFiles(kbt, String(id), 'files', entries);
    b.done('Attached ' + plural(entries.length, 'file') + ' to #' + id + (target.create ? ' (new record)' : ''), { action: 'Open record', onAction: () => openRecord(id) });
  } catch (e) { b.fail(e); }
  invalidate(KB_BUCKET);
  if (st.view === 'table' && TB.name === KB_TABLE) reloadTable(); else renderList();
}
function pastedName(f, i, n) {
  const d = new Date(), pad = (x) => String(x).padStart(2, '0');
  const stamp = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
  const generic = !f.name || /^image\.(png|jpe?g|gif|webp)$/i.test(f.name);
  const ext = ((f.type || 'image/png').split('/')[1] || 'png').replace('jpeg', 'jpg');
  return generic ? 'Pasted image ' + stamp + (n > 1 ? ' ' + (i + 1) : '') + '.' + ext : f.name;
}

/* ---------- Buckets (every bucket, with counts) ---------- */
async function loadBuckets(force) {
  if (!force && BK.list && Date.now() - BK.ts < 60000) return BK.list;
  if (BK.loading) return BK.loading;
  BK.loading = (async () => {
    const l = await db.rpc('ql_db_buckets');
    BK.list = Array.isArray(l) ? l : [];
    BK.by = new Map(BK.list.map((b) => [b.id, b]));
    BK.ts = Date.now();
    return BK.list;
  })();
  try { return await BK.loading; } finally { BK.loading = null; }
}

/* ---------- Older versions (Replace keeps the old file) ---------- */
function verStamp() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '-' + String(d.getMilliseconds()).padStart(3, '0');
}
async function archiveVersion(bucket, key) {
  let dest = VERS + key + '/' + verStamp() + '_' + segOf(key);
  try { await api.copy(bucket, key, dest); }
  catch (e) {
    if (e.kind !== 'dup') throw e;
    dest = VERS + key + '/' + verStamp() + '-' + Math.random().toString(36).slice(2, 5) + '_' + segOf(key);
    await api.copy(bucket, key, dest);
  }
  return dest;
}
async function moveVersions(bucket, fromKey, toKey, toBucket) {
  const a = VERS + fromKey + (fromKey.endsWith('/') ? '' : '/'), b = VERS + toKey + (toKey.endsWith('/') ? '' : '/');
  try { await moveTree(bucket, a, b, toBucket); } catch (e) { /* best effort: history stays at the old path */ }
}
function verDate(name) {
  const m = /^(\d{4})(\d\d)(\d\d)-(\d\d)(\d\d)(\d\d)/.exec(name);
  return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime() : 0;
}
async function doVersions(it) {
  const prefix = VERS + it.key + '/';
  let rows;
  try { rows = (await api.listAll(it.bucket, prefix)).filter((r) => r.id != null); }
  catch (e) { toast(e.message, { error: true }); return; }
  const vers = rows.map((r) => normRow(it.bucket, prefix, r)).map((v) => Object.assign(v, { when: verDate(v.seg) || v.updated, name: it.name })).sort((a, b) => b.when - a.when);
  await dialog({
    title: 'Older versions of “' + it.name + '”', width: 560,
    body: vers.length ? '<p>Replacing a file keeps the old one here. Restore puts a version back and keeps the current file as a version too.</p><div class="vlist">' + vers.map((v, i) => '<div class="vrow"><span class="vwhen">' + esc(fmtDate(v.when, true)) + '</span><span class="vsize">' + esc(fmtSize(v.size)) + '</span>' +
      '<button type="button" class="btn" data-vdl="' + i + '">' + ico('download') + 'Download</button><button type="button" class="btn" data-vrs="' + i + '">' + ico('restore') + 'Restore</button></div>').join('') + '</div>'
      : '<p>No older versions yet. When you upload a file with the same name and choose Replace, the old one is kept here.</p>',
    buttons: [{ label: 'Close', kind: 'primary', primary: true, value: true }],
    init: (ctx) => {
      ctx.body.addEventListener('click', async (e) => {
        const d = e.target.closest('[data-vdl]'), r = e.target.closest('[data-vrs]');
        if (d) { const v = vers[+d.dataset.vdl]; downloadOne(Object.assign({}, v, { name: it.name })); return; }
        if (!r) return;
        const v = vers[+r.dataset.vrs];
        ctx.close(true);
        const b = busy('Restoring version…');
        try {
          await archiveVersion(it.bucket, it.key);
          const blob = await getBlob(it.bucket, v.key);
          await putFile(it.bucket, it.key, blob, { upsert: true });
          urlCache.delete(it.bucket + '|' + it.key);
          b.done('Restored the version from ' + fmtDate(v.when, true) + '. The replaced file was kept as a version.');
        } catch (err) { b.fail(err.kind === 'perm' ? new ApiError('Can’t replace files in ' + bucketLabel(it.bucket) + ' (no update permission).', 403, 'perm') : err); }
        await refreshAfter([it.bucket], [it.id]);
      });
    }
  });
}

async function shrinkImage(file) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 480 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((res) => c.toBlob((b) => res(b || file), 'image/jpeg', 0.86));
  } catch (e) { return file; }
}

/* ---------- Duty roster: public holidays + Sundays (tables ql_holidays, ql_roster) ---------- */
const ROS = { year: 2026, rows: [], hols: [], ts: 0, set: new Set() };
const rosKind = () => (prefs.rosKind === 'weekend' ? 'weekend' : 'holiday');
const rosMonth = () => (prefs.rosMonth == null ? 'all' : prefs.rosMonth);
const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
async function loadRoster(force) {
  if (!force && ROS.ts && ROS.loadedYear === ROS.year && Date.now() - ROS.ts < 30000) return;
  const y = ROS.year;
  const both = await Promise.all([
    db.req('GET', '/ql_roster?select=*&rdate=gte.' + y + '-01-01&rdate=lte.' + y + '-12-31&order=rdate.asc'),
    db.req('GET', '/ql_holidays?select=*&hdate=gte.' + y + '-01-01&hdate=lte.' + y + '-12-31&order=hdate.asc')
  ]);
  ROS.rows = both[0] || []; ROS.hols = both[1] || []; ROS.ts = Date.now(); ROS.loadedYear = y;
  ROS.set = new Set(ROS.rows.map((r) => r.kind + '|' + r.staff_id + '|' + r.rdate));
}
function rosDates() {
  if (rosKind() === 'holiday') return ROS.hols.filter((h) => h.works !== false).map((h) => ({ d: h.hdate, h: h }));
  const out = [], d = new Date(ROS.year, 0, 1);
  while (d.getDay() !== 0) d.setDate(d.getDate() + 1);
  while (d.getFullYear() === ROS.year) { const m = rosMonth(); if (m === 'all' || +m === d.getMonth()) out.push({ d: ymd(d) }); d.setDate(d.getDate() + 7); }
  return out;
}
function rosStaff() {
  const kind = rosKind(), withDuty = new Set(ROS.rows.filter((r) => r.kind === kind).map((r) => r.staff_id));
  const show = prefs.rosAll ? STAFF.rows.filter((x) => x.active !== false) : STAFF.rows.filter((x) => withDuty.has(x.id));

/* ================= Apps (sidebar group) =================
   Each app is a ql_kb row: category "ql_app" + a {"qlApp":true} marker in content (survives re-categorising).

const APP_CAT = 'ql_app', APP_DIR = 'ql_apps/', APP_CACHE = 'ql_app_cache:';

const APP_COLS = 'id,data,content,category,type,ref,files,deleted_at';
const isAppRow = (r) => r.category === APP_CAT || /^\{"qlApp"/.test(r.content || '');
function appOf(r) {
  let m = {}; try { m = JSON.parse(r.content || '{}') || {}; } catch (e) { m = {}; }

async function loadApps() {

    const both = await Promise.all([db.req('GET', q + 'category=eq.' + APP_CAT), db.req('GET', q + 'content=like.' + encodeURIComponent('{"qlApp"*'))]);
    const byId = new Map(); (both[0] || []).concat(both[1] || []).forEach((r) => byId.set(r.id, r));
    const rows = Array.from(byId.values()).sort((a, b) => a.id - b.id);
    rows.filter((r) => r.category !== APP_CAT).forEach((r) => { db.req('PATCH', '/' + KB_TABLE + '?id=eq.' + r.id, { category: APP_CAT }).catch(() => {}); });

    const el = node.closest && node.closest('#list [data-id], [data-drop], #nav [data-go="trash"], #nav [data-go="home"], #bucketNav [data-bucket]');
    if (!el || !internal) return null;
    if (el.matches('[data-go="trash"]')) return st.view === 'trash' ? null : { el: el, run: (its) => doTrash(its) };
    let dest;
    if (el.matches('[data-id]')) { const it = st.byId.get(el.dataset.id); if (!it || !it.folder || it.trash || st.sel.has(it.id)) return null; dest = { bucket: it.bucket, prefix: it.key }; }
    else if (el.matches('[data-drop]')) { const bp = splitId(el.dataset.drop); dest = { bucket: bp[0], prefix: bp[1] }; }
    else if (el.matches('[data-go="home"]')) dest = { bucket: homeBucket(), prefix: '' };
    else dest = { bucket: el.dataset.bucket, prefix: '' };
    if (internal.every((i) => i.bucket === dest.bucket && parentOf(i.key) === dest.prefix)) return null;
    if (internal.some((i) => i.folder && i.bucket === dest.bucket && dest.prefix.indexOf(i.key) === 0)) return null;
    return { el: el, run: (its) => moveItemsTo(its, dest, 'move') };
  };
  const isFileDrag = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).indexOf('Files') >= 0;
  document.addEventListener('dragover', (e) => {
    if (internal) { const t = internalTarget(e.target); markDrop(t ? t.el : null); if (t) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; } return; }
    if (isFileDrag(e) && !e.target.closest('#pane, #recPanel')) { e.preventDefault(); e.dataTransfer.dropEffect = 'none'; }
  });
  document.addEventListener('drop', (e) => {
    if (internal) { e.preventDefault(); const t = internalTarget(e.target), its = internal; internal = null; markDrop(null); if (t) t.run(its); return; }
    if (isFileDrag(e) && !e.target.closest('#pane, #recPanel')) e.preventDefault();
  });
  document.addEventListener('dragend', () => { internal = null; markDrop(null); });

  // Paste screenshots / files
  document.addEventListener('paste', (e) => {
    if (dialogOpen() || !$('#viewer').hidden) return;
    const files = Array.from((e.clipboardData && e.clipboardData.files) || []);
    if (!files.length) return;
    if (!$('#recPanel').hidden && RW.row) {
      e.preventDefault();
      dropIntoRow(files.map((f, i) => ({ file: f, name: pastedName(f, i, files.length) })));
      return;
    }
    if (isTyping(e.target)) return;
    e.preventDefault();
    if (st.view !== 'folder') { toast('Open a folder first, then paste.'); return; }
    uploadEntries(files.map((f, i) => ({ file: f, rel: pastedName(f, i, files.length) })), curTarget());
  });

  // File pickers
  $('#fileIn').onchange = (e) => { const fs = Array.from(e.target.files || []); e.target.value = ''; if (fs.length) uploadEntries(fs.map((f) => ({ file: f, rel: f.name })), pickTarget || curTarget()); };
  $('#dirIn').onchange = (e) => { const fs = Array.from(e.target.files || []); e.target.value = ''; if (fs.length) uploadEntries(fs.map((f) => ({ file: f, rel: f.webkitRelativePath || f.name })), pickTarget || curTarget()); };

  // Menu, transfers, viewer
  $('#menu').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-i]'); if (!b) return;
    const spec = ($('#menu')._items || [])[+b.dataset.i];
    closeMenu(); if (spec && spec.act) spec.act();
  });
  document.addEventListener('pointerdown', (e) => { if (!$('#menu').hidden && !e.target.closest('#menu')) closeMenu(); }, true);
  window.addEventListener('resize', closeMenu);
  $('#xfers').addEventListener('click', (e) => {
    if (e.target.closest('[data-xmin]')) { xfer.min = !xfer.min; xfer.paintNow(); return; }
    if (e.target.closest('[data-xclose]')) { xfer.close(); return; }
    const c = e.target.closest('[data-xcancel]');
    if (c) { const t = xfer.list.find((x) => x.id === c.dataset.xcancel); if (t) t.ctl.abort(); }
  });
  $('#viewer').addEventListener('click', (e) => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    const it = V.list[V.idx];
    switch (b.dataset.v) {
      case 'close': closeViewer(); break;
      case 'prev': if (V.idx > 0) { V.idx--; showV(); } break;
      case 'next': if (V.idx < V.list.length - 1) { V.idx++; showV(); } break;
      case 'download': doDownload([it]); break;
      case 'share': doShare([it]); break;
      case 'info': doDetails(it); break;
    }
  });

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (dialogOpen()) return;
    if (!$('#viewer').hidden) {
      if (e.key === 'Escape') { e.preventDefault(); if (!mailBack()) closeViewer(); }
      else if (ATT.stack.length) { /* attachment open: keep arrows for its content */ }
      else if (e.key === 'ArrowLeft' && V.idx > 0) { V.idx--; showV(); }
      else if (e.key === 'ArrowRight' && V.idx < V.list.length - 1) { V.idx++; showV(); }
      return;
    }
    const m = $('#menu');
    if (!m.hidden) {
      const btns = $$('button:not([disabled])', m), i = btns.indexOf(document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); closeMenu(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); (btns[i + 1] || btns[0]).focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); (btns[i - 1] || btns[btns.length - 1]).focus(); }
      return;
    }
    if (!$('#ntPanel').hidden && e.key === 'Escape' && !isTyping(e.target)) { e.preventDefault(); closeNtPage(); if (st.view === 'notion') go({ view: 'notion', n: '' }, true); return; }
    if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-ntpage]')) { e.preventDefault(); go({ view: 'notion', n: e.target.dataset.ntpage }, true); return; }
    const panelOpen = !$('#recPanel').hidden;
    if (panelOpen && e.target.closest && e.target.closest('#recPanel')) {
      if (e.key === 'Escape') { e.preventDefault(); if (isTyping(e.target)) e.target.blur(); else closeRow(); }
      return;
    }
    if (isTyping(e.target)) return;
    if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('button,a')) return;
    if (e.key === 'Enter' && e.target.matches && e.target.matches('.oc[data-oid]')) { e.preventDefault(); doEditStaff(+e.target.dataset.oid); return; }
    if (e.key === 'Enter' && e.target.matches && e.target.matches('tr.srow')) { e.preventDefault(); doEditStaff(+e.target.dataset.staff); return; }
    if (e.key === 'Enter' && e.target.matches && e.target.matches('tr.rrow') && st.view === 'table') {
      e.preventDefault(); const k = e.target.dataset.key, i = TB.keys.indexOf(k); openRow(TB.name, k, i >= 0 ? TB.rows[i] : null); return;
    }
    if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-table]')) { e.preventDefault(); go({ view: 'table', t: e.target.dataset.table }); return; }
    const mod = e.metaKey || e.ctrlKey;
    if (e.key === '/' && !mod) { e.preventDefault(); qi.focus(); return; }
    if (mod && (e.key === 'a' || e.key === 'A')) { e.preventDefault(); st.sel = new Set(st.order); syncSel(); return; }
    if (e.key === 'Escape') { if (panelOpen) { closeRow(); return; } if (st.sel.size) { st.sel.clear(); syncSel(); } closeDrawer(); return; }
    if (st.view === 'table' && /^Arrow(Up|Down)$/.test(e.key)) {
      const rows = $$('#list tr.rrow');
      if (!rows.length) return;
      e.preventDefault();
      const i = rows.indexOf(document.activeElement), n = rows[Math.max(0, Math.min(rows.length - 1, i < 0 ? 0 : i + (e.key === 'ArrowDown' ? 1 : -1)))];
      n.focus(); n.scrollIntoView({ block: 'nearest' });
      return;
    }
    if (/^Arrow(Up|Down|Left|Right)$/.test(e.key) && st.order.length) {
      e.preventDefault();
      const fwd = e.key === 'ArrowDown' || e.key === 'ArrowRight';
      const cur = st.anchor ? st.order.indexOf(st.anchor) : -1;
      const id = st.order[Math.max(0, Math.min(st.order.length - 1, cur < 0 ? 0 : cur + (fwd ? 1 : -1)))];
      if (!e.shiftKey) st.sel.clear();
      st.sel.add(id); st.anchor = id; syncSel();
      const el = document.querySelector('#list [data-id="' + cssEsc(id) + '"]');
      if (el) { el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'nearest' }); }
      return;
    }
    const items = selItems(); if (!items.length) return;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); if (st.view === 'trash') doPurge(items); else doTrash(items); }
    else if (e.key === 'F2' && items.length === 1 && st.view !== 'trash') { e.preventDefault(); doRename(items[0]); }
    else if (e.key === 'Enter' && items.length === 1) { e.preventDefault(); openItem(items[0]); }
  });

  window.addEventListener('hashchange', () => applyRoute(readHash()));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - st.loadedAt > 30000 && !dialogOpen() && !st.loading) load({ silent: true });
  });
}

/* ================= Boot ================= */
function boot() {
  applyTheme();
  if (isTouch) document.body.classList.add('touch');
  bindEvents();
  bindApps(); renderApps(); bindOrg(); bindNotion();
  const r = readHash();
  if (hashOf(r) !== location.hash) { try { history.replaceState(null, '', hashOf(r)); } catch (e) { /* sandboxed frame */ } }
  applyRoute(r);
  loadBuckets().then(() => { renderChrome(); if (st.view === 'folder' && !st.items.length && !st.loading) renderList(); }).catch(() => {});
  loadStars().then(() => { if (st.items.length) renderList(); });
  loadApps();
  // ql_kb index in the background so Drive files show the record they belong to
  setTimeout(() => {
    loadRecords().then(() => {
      if (st.view === 'folder' || st.view === 'search' || st.view === 'recent' || st.view === 'starred') {
        if (st.items.some((it) => REC.byPath.has(it.bucket + '|' + it.key))) renderList();
      }
    }).catch(() => {});
  }, 1200);
}
startThai();
boot();
})();
</script>
</body>
